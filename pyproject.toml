[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lcatoolbox"
version = "0.1.0"
authors = [{name = "Jonathan Larochelle", email = "jonathan.larochelle@h-ka.de"}, ]
description = "(...)"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "brightway25",
    "numpy",
    "pyexcel",
    "pandas",
    "SALib",
]
license = {file = "LICENSE"}

[project.optional-dependencies]
test = [
    "pytest",
    "odfpy",
    "pyexcel-ods"]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}
packages = ["lcatoolbox"]

[project.urls]
Homepage = "https://github.com/HKA-IES/lca_toolbox"
Issues = "https://github.com/HKA-IES/lca_toolbox/issues"